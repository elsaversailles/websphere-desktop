services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE:-websphere}
      MYSQL_USER: ${MYSQL_USER:-websphere}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-websphere}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
    ports: ["127.0.0.1:3306:3306"]
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck: { test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_ROOT_PASSWORD mysqladmin ping --host=127.0.0.1 --user=root --silent"], interval: 10s, timeout: 5s, retries: 18 }
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports: ["127.0.0.1:6379:6379"]
    healthcheck: { test: ["CMD", "redis-cli", "ping"], interval: 5s, timeout: 3s, retries: 12 }
  coturn:
    image: coturn/coturn:4.6.2
    profiles: ["turn"]
    restart: unless-stopped
    env_file: ../.env
    command:
      - -n
      - --log-file=stdout
      - --fingerprint
      - --use-auth-secret
      - --static-auth-secret=${TURN_SHARED_SECRET:-}
      - --realm=${TURN_REALM:-websphere}
      - --external-ip=${TURN_EXTERNAL_IP:-}
      - --min-port=${TURN_RELAY_MIN_PORT:-49160}
      - --max-port=${TURN_RELAY_MAX_PORT:-49200}
      - --cert=/etc/letsencrypt/live/${TURN_CERT_NAME:-}/fullchain.pem
      - --pkey=/etc/letsencrypt/live/${TURN_CERT_NAME:-}/privkey.pem
      - --no-cli
      - --no-multicast-peers
    ports:
      - "3478:3478/tcp"
      - "3478:3478/udp"
      - "5349:5349/tcp"
      - "5349:5349/udp"
      - "${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}:${TURN_RELAY_MIN_PORT:-49160}-${TURN_RELAY_MAX_PORT:-49200}/udp"
    volumes:
      - "${TURN_CERT_DIR:-./certs}:/etc/letsencrypt:ro"
  api:
    build: { context: .., dockerfile: docker/Dockerfile.api, args: { NODE_OPTIONS: "${DOCKER_BUILD_NODE_OPTIONS:---max-old-space-size=512}" } }
    restart: unless-stopped
    env_file: ../.env
    environment: { DATABASE_URL: "${DATABASE_URL_DOCKER:-mysql://websphere:websphere@mysql:3306/websphere}", REDIS_URL: "${REDIS_URL_DOCKER:-redis://redis:6379}", UPLOAD_DIR: /var/lib/websphere/uploads }
    volumes: [websphere_uploads:/var/lib/websphere/uploads]
    depends_on: { mysql: { condition: service_healthy }, redis: { condition: service_started } }
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:3000/health || exit 1"], interval: 10s, timeout: 5s, retries: 18, start_period: 20s }
  worker:
    build: { context: .., dockerfile: docker/Dockerfile.worker, args: { NODE_OPTIONS: "${DOCKER_BUILD_NODE_OPTIONS:---max-old-space-size=512}" } }
    restart: unless-stopped
    env_file: ../.env
    environment: { DATABASE_URL: "${DATABASE_URL_DOCKER:-mysql://websphere:websphere@mysql:3306/websphere}", REDIS_URL: "${REDIS_URL_DOCKER:-redis://redis:6379}" }
    depends_on: [mysql, redis]
  mcp:
    build: { context: .., dockerfile: docker/Dockerfile.mcp, args: { NODE_OPTIONS: "${DOCKER_BUILD_NODE_OPTIONS:---max-old-space-size=512}" } }
    restart: unless-stopped
    env_file: ../.env
    environment: { DATABASE_URL: "${DATABASE_URL_DOCKER:-mysql://websphere:websphere@mysql:3306/websphere}" }
    stdin_open: true
    depends_on: [mysql]
  web:
    build: { context: .., dockerfile: docker/Dockerfile.web, args: { NODE_OPTIONS: "${DOCKER_BUILD_NODE_OPTIONS:---max-old-space-size=512}" } }
    restart: unless-stopped
    ports: ["127.0.0.1:8080:80"]
    depends_on: [api]
    healthcheck: { test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/api/health || exit 1"], interval: 10s, timeout: 5s, retries: 18, start_period: 10s }
volumes: { mysql_data: {}, websphere_uploads: {} }
