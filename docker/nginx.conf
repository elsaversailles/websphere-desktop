server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  location / { try_files $uri $uri/ /index.html; }
  location /api/ { proxy_pass http://api:3000/; proxy_set_header Host $host; proxy_set_header X-Forwarded-Proto $scheme; }
  location /uploads/ { proxy_pass http://api:3000/uploads/; proxy_set_header Host $host; }
  location /socket.io/ { proxy_pass http://api:3000/socket.io/; proxy_http_version 1.1; proxy_set_header Upgrade $http_upgrade; proxy_set_header Connection "upgrade"; }
}
